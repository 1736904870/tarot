<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>塔罗牌抽牌 · AI解读</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
    font-size: 16px; -webkit-text-size-adjust: 100%;
    background: linear-gradient(135deg, #0a0a1a 0%, #1a1a3a 50%, #0d0d2a 100%);
    min-height: 100vh; color: #e8dcc8; overflow-x: hidden;
  }
  body::before {
    content: ''; position: fixed; top:0; left:0; right:0; bottom:0;
    background-image:
      radial-gradient(2px 2px at 20px 30px, #fff, transparent),
      radial-gradient(2px 2px at 40px 70px, rgba(255,255,255,0.8), transparent),
      radial-gradient(1px 1px at 90px 40px, #fff, transparent),
      radial-gradient(2px 2px at 130px 80px, rgba(255,255,255,0.6), transparent),
      radial-gradient(1px 1px at 160px 120px, #fff, transparent);
    background-size: 200px 200px; animation: twinkle 8s ease-in-out infinite;
    pointer-events: none; z-index: 0;
  }
  @keyframes twinkle { 0%,100%{opacity:0.5} 50%{opacity:1} }
  .container { position: relative; z-index: 1; max-width: 480px; margin: 0 auto; padding: 22px 16px 30px; }
  h1 {
    text-align: center; font-size: 2.2em;
    background: linear-gradient(135deg, #f0d68a, #c9a84c, #f0d68a);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    margin-bottom: 5px; letter-spacing: 6px;
  }
  .subtitle { text-align: center; color: #8a7a5c; font-size: 0.88em; margin-bottom: 25px; letter-spacing: 2px; }
  .panel {
    background: rgba(20,20,45,0.85); border: 1px solid rgba(201,168,76,0.3);
    border-radius: 14px; padding: 20px 25px; margin-bottom: 20px;
    backdrop-filter: blur(10px); box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }
  .panel-title { font-size: 1em; color: #c9a84c; letter-spacing: 3px; margin-bottom: 15px; }
  .panel-title::before { content: '✦ '; }
  .form-row { display: flex; flex-wrap: wrap; gap: 15px; align-items: flex-end; }
  .form-group { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 180px; }
  /* 手机 App 风格：API 设置每项独占一行，靠左对齐 */
  .api-form { display: flex; flex-direction: column; gap: 14px; text-align: left; align-items: stretch; }
  .api-form .form-group { flex: none; width: 100%; min-width: 0; }
  .api-form .form-group input { width: 100%; }
  .api-form .api-btn-row { display: flex; justify-content: flex-start; }
  .form-group label { font-size: 0.82em; color: #c9a84c; letter-spacing: 1px; }
  .form-group input, .form-group select, .form-group textarea {
    background: rgba(10,10,30,0.8); border: 1px solid rgba(201,168,76,0.35);
    color: #e8dcc8; padding: 12px 14px; border-radius: 10px; font-size: 16px;
    outline: none; transition: border-color 0.3s; font-family: inherit;
    -webkit-appearance: none; appearance: none;
  }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: #c9a84c; }
  .form-group textarea { min-height: 65px; resize: vertical; }
  .mode-tabs { display: flex; gap: 10px; margin-bottom: 15px; }
  .mode-tab {
    flex: 1; padding: 12px; text-align: center; border-radius: 10px; cursor: pointer;
    border: 1px solid rgba(201,168,76,0.3); background: rgba(10,10,30,0.6);
    transition: all 0.3s; font-size: 0.95em; letter-spacing: 2px;
  }
  .mode-tab:hover { border-color: rgba(201,168,76,0.6); }
  .mode-tab.active {
    background: linear-gradient(135deg, rgba(201,168,76,0.25), rgba(201,168,76,0.1));
    border-color: #c9a84c; color: #f0d68a; font-weight: bold;
  }
  .mode-tab .mode-desc { font-size: 0.72em; color: #8a7a5c; margin-top: 4px; letter-spacing: 0; }
  .mode-tab.active .mode-desc { color: #b8a060; }
  .btn {
    background: linear-gradient(135deg, #c9a84c, #8a6d2f); color: #0a0a1a;
    border: none; padding: 14px 32px; font-size: 1.02em; font-weight: bold;
    border-radius: 50px; cursor: pointer; letter-spacing: 3px; transition: all 0.3s;
    box-shadow: 0 4px 20px rgba(201,168,76,0.4);
    -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 30px rgba(201,168,76,0.6); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  .btn-secondary {
    background: transparent; color: #c9a84c; border: 1px solid #c9a84c;
    box-shadow: none; padding: 12px 24px; font-size: 0.9em;
  }
  .btn-secondary:hover { background: rgba(201,168,76,0.1); }
  .spread-area {
    display: flex; flex-wrap: wrap; gap: 22px; justify-content: center;
    min-height: 280px; padding: 15px 0;
  }
  .card-slot { display: flex; flex-direction: column; align-items: center; gap: 10px; perspective: 1000px; }
  .card-position-label { font-size: 0.82em; color: #c9a84c; letter-spacing: 1px; min-height: 1.2em; text-align: center; }
  .card {
    width: 160px; height: 267px; position: relative; transform-style: preserve-3d;
    transition: transform 0.8s cubic-bezier(0.4,0,0.2,1); cursor: pointer;
  }
  .card.flipped { transform: rotateY(180deg); }
  .card.reversed.flipped { transform: rotateY(180deg) rotate(180deg); }
  .card-face {
    position: absolute; width: 100%; height: 100%; backface-visibility: hidden;
    border-radius: 10px; overflow: hidden;
    box-shadow: 0 8px 25px rgba(0,0,0,0.5), 0 0 15px rgba(201,168,76,0.2);
    border: 2px solid rgba(201,168,76,0.5);
  }
  .card-back { background: linear-gradient(135deg, #1a1a4a, #2a1a4a, #1a1a4a); display: flex; align-items: center; justify-content: center; }
  .card-back::before { content: '✦'; font-size: 3.5em; color: rgba(201,168,76,0.6); text-shadow: 0 0 20px rgba(201,168,76,0.5); }
  .card-back-pattern { position: absolute; inset: 8px; border: 1px solid rgba(201,168,76,0.3); border-radius: 6px; }
  .card-front { transform: rotateY(180deg); background: #fff; }
  .card-front img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card-info { text-align: center; min-height: 48px; }
  .card-name { font-size: 1em; color: #f0d68a; font-weight: bold; }
  .card-name-en { font-size: 0.72em; color: #8a7a5c; margin-top: 2px; }
  .card-orientation {
    display: inline-block; margin-top: 4px; padding: 2px 10px; border-radius: 20px;
    font-size: 0.72em; letter-spacing: 1px;
  }
  .card-orientation.upright { background: rgba(76,175,80,0.2); color: #81c784; border: 1px solid rgba(76,175,80,0.4); }
  .card-orientation.reversed { background: rgba(244,67,54,0.2); color: #ef9a9a; border: 1px solid rgba(244,67,54,0.4); }
  .ai-actions { display: flex; gap: 12px; justify-content: center; margin-bottom: 15px; flex-wrap: wrap; }
  .reading-box {
    background: rgba(10,10,25,0.9); border: 1px solid rgba(201,168,76,0.25);
    border-radius: 12px; padding: 25px; line-height: 1.9; font-size: 0.95em;
    color: #d0c4a8; white-space: pre-wrap; min-height: 100px;
  }
  .reading-box h3 { color: #f0d68a; font-size: 1.1em; margin: 15px 0 6px; }
  .reading-box h3:first-child { margin-top: 0; }
  .reading-box strong { color: #e8d090; }
  .status-msg { text-align: center; color: #8a7a5c; font-size: 0.88em; margin: 10px 0; min-height: 1.5em; }
  .status-msg.error { color: #ef9a9a; }
  .status-msg.success { color: #81c784; }
  .operation-status {
    margin-top: 12px; padding: 12px 18px; background: rgba(201,168,76,0.1);
    border: 1px solid rgba(201,168,76,0.3); border-radius: 10px; text-align: center;
    font-size: 0.92em; color: #f0d68a; letter-spacing: 1px;
  }
  .cursor-blink {
    display: inline-block; width: 8px; height: 16px; background: #c9a84c;
    animation: blink 1s infinite; vertical-align: middle; margin-left: 4px;
  }
  @keyframes blink { 0%,50%{opacity:1} 51%,100%{opacity:0} }
  .footer { text-align: center; margin-top: 30px; color: #5a4a3a; font-size: 0.78em; letter-spacing: 2px; }
  @media (max-width: 600px) {
    h1 { font-size: 1.45em; letter-spacing: 2px; }
    .subtitle { font-size: 0.8em; margin-bottom: 18px; }
    .panel { padding: 16px 14px; border-radius: 16px; }
    .card { width: 108px; height: 180px; }
    .spread-area { gap: 14px; min-height: 220px; }
    .form-row { flex-direction: column; align-items: stretch; }
    .form-row .form-group { width: 100%; min-width: 0; max-width: none !important; flex: none !important; }
    .form-row .btn { width: 100%; }
    .mode-tab { padding: 12px 6px; font-size: 0.88em; }
    .ai-actions .btn { flex: 1 1 40%; }
    .reading-box { padding: 16px 14px; font-size: 0.92em; }
  }
</style>
</head>
<body>
<div class="container">
  <h1>塔 罗 牌 · A I 解 读</h1>
  <p class="subtitle">78张完整牌库 · 现实占卜 / 梦向占卜双模式</p>

  <div class="panel">
    <div class="panel-title">AI 接 口 设 置</div>
    <div class="api-form">
      <div class="form-group">
        <label>API 地址（Base URL）</label>
        <input type="text" id="apiBase" placeholder="https://api.deepseek.com/v1">
      </div>
      <div class="form-group">
        <label>模型（点右侧获取）</label>
        <div style="display:flex; gap:8px;">
          <input type="text" id="apiModel" list="modelList" placeholder="点击获取或手动输入" style="flex:1; min-width:0;">
          <datalist id="modelList"></datalist>
          <button class="btn btn-secondary" style="padding:12px 16px; white-space:nowrap;" onclick="fetchModels()">获取</button>
        </div>
      </div>
      <div class="form-group">
        <label>API Key</label>
        <input type="password" id="apiKey" placeholder="sk-xxxxxxxxxxxxxxxx" onkeydown="if(event.key==='Enter')fetchModels()">
      </div>
      <div class="api-btn-row">
        <button class="btn btn-secondary" onclick="saveApiConfig()">保存</button>
      </div>
    </div>
    <div class="status-msg" id="apiStatus" style="text-align:left;"></div>
  </div>

  <div class="panel">
    <div class="panel-title">占 卜 设 置</div>
    <div class="mode-tabs">
      <div class="mode-tab active" data-mode="reality" onclick="setMode('reality')">
        🔮 现实占卜
        <div class="mode-desc">标准塔罗牌逻辑解读</div>
      </div>
      <div class="mode-tab" data-mode="dream" onclick="setMode('dream')">
        🌙 梦向占卜（梦占）
        <div class="mode-desc">梦女文化视角解读梦角传讯</div>
      </div>
    </div>
    <div class="form-group" style="margin-bottom:15px;">
      <label>你的占卜问题</label>
      <textarea id="question" placeholder="现实占卜示例：我和他接下来的感情发展会怎么样？&#10;梦占示例：我梦角最近想对我说什么？我们的关系接下来会怎么发展？"></textarea>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>牌阵</label>
        <select id="spreadSelect">
          <option value="single">单张指引（1张）</option>
          <option value="three" selected>过去·现在·未来（3张）</option>
          <option value="five">五牌阵（5张）</option>
          <option value="seven">七牌阵（7张）</option>
          <option value="ten">凯尔特十字（10张）</option>
          <option value="custom">自定义数量</option>
        </select>
      </div>
      <div class="form-group" id="customGroup" style="display:none; max-width:100px;">
        <label>数量</label>
        <select id="customCount">
          <option value="1">1</option><option value="2">2</option><option value="3">3</option>
          <option value="4">4</option><option value="5">5</option><option value="6">6</option>
          <option value="7">7</option><option value="8">8</option><option value="9">9</option>
          <option value="10">10</option><option value="11">11</option><option value="12">12</option>
        </select>
      </div>
      <div class="form-group" style="flex:0.5;">
        <label>&nbsp;</label>
        <button class="btn" id="drawBtn" onclick="drawCards()">开始抽牌</button>
      </div>
    </div>
    <div class="status-msg" id="statusMsg">静心思考你的问题，然后点击"开始抽牌"</div>
  </div>

  <div class="spread-area" id="spreadArea"></div>

  <div class="panel" id="aiSection" style="display:none;">
    <div class="panel-title">A I 解 读</div>
    <div class="ai-actions">
      <button class="btn" id="interpretBtn" onclick="startInterpretation()">✨ 生成AI解读</button>
      <button class="btn" id="continueBtn" onclick="continueReading()" style="display:none; background:linear-gradient(135deg,#8a6d2f,#6a4d1f);">📝 继续生成</button>
      <button class="btn btn-secondary" onclick="copyReading()">📋 复制</button>
      <button class="btn btn-secondary" onclick="clearReading()">🗑 清空</button>
    </div>
    <div class="status-msg" id="aiStatus"></div>
    <div class="reading-box" id="readingBox"><span style="color:#5a4a3a;">抽牌后点击"生成AI解读"</span></div>
    <div class="operation-status" id="operationStatus" style="display:none;">
      <span id="operationStatusText"></span>
      <span class="cursor-blink" id="opCursor"></span>
    </div>

    <div id="feedbackPanel" style="display:none; margin-top:20px; padding-top:18px; border-top:1px solid rgba(201,168,76,0.2);">
      <div style="font-size:0.95em; color:#c9a84c; letter-spacing:2px; margin-bottom:10px;">✦ 反 馈 修 正</div>
      <div class="form-group" style="margin-bottom:12px;">
        <label style="font-size:0.82em; color:#a89870;">觉得哪些地方解读不准？描述一下，AI会根据你的反馈修正</label>
        <textarea id="feedbackInput" style="min-height:55px;" placeholder="例如：我和他已经分手了，不是还在交往中 / 梦角最近没有主动联系我..."></textarea>
      </div>
      <div style="display:flex; gap:10px; flex-wrap:wrap; justify-content:center;">
        <button class="btn btn-secondary" onclick="supplementReading()" style="font-size:0.88em;">🃏 补充抽牌解读</button>
        <button class="btn btn-secondary" onclick="redrawReading()" style="font-size:0.88em;">🔄 重新抽牌解读</button>
        <button class="btn btn-secondary" onclick="reviseReading()" style="font-size:0.88em;">✏️ 直接修正</button>
      </div>
    </div>

    <div id="supplementCardsArea" style="display:none; margin-top:15px;">
      <div style="font-size:0.88em; color:#a89870; text-align:center; margin-bottom:10px;">—— 补充牌 ——</div>
      <div class="spread-area" id="supplementCards" style="min-height:0;"></div>
    </div>
  </div>

  <p class="footer">静心 · 专注 · 倾听内心的声音</p>
</div>

async function fetchModels() {
  const base = document.getElementById('apiBase').value.trim();
  const key = document.getElementById('apiKey').value.trim();
  const input = document.getElementById('apiModel');
  const datalist = document.getElementById('modelList');
  if (!base || !key) { setApiStatus('请先填写 API 地址和 Key', 'error'); return; }
  setApiStatus('正在获取模型列表...');
  try {
    const url = base.replace(/\/$/, '') + '/models';
    const response = await fetch(url, { headers: { 'Authorization': 'Bearer ' + key } });
    if (!response.ok) throw new Error('HTTP ' + response.status);
    const data = await response.json();
    const models = (data.data || []).map(m => m.id).filter(Boolean).sort();
    datalist.innerHTML = '';
    models.forEach(function(m) {
      const opt = document.createElement('option');
      opt.value = m;
      datalist.appendChild(opt);
    });
    if (!input.value.trim() && models.length > 0) {
      input.value = models.find(function(m) { return /chat|turbo|4o|plus|pro|flash/i.test(m); }) || models[0];
    }
    setApiStatus('✅ 已获取 ' + models.length + ' 个模型，点击输入框可选择', 'success');
  } catch (err) {
    setApiStatus('获取模型失败：' + err.message + '，可手动输入模型名', 'error');
  }
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

  const v = document.getElementById('spreadSelect').value;

  return {single:1, three:3, five:5, seven:7, ten:10}[v] || 3;
}

  const arr = [];

  return arr;
}

async function callAI(cfg, systemPrompt, userPrompt, existingContent) {
  const url = cfg.base.replace(/\/$/, '') + '/chat/completions';
  let messages;
  if (existingContent) {
    messages = [
      { role: 'system', content: systemPrompt + '\n\n用户之前的解读被截断了，请接着上面的内容继续写完，不要重复已经说过的内容，直接从被截断的地方继续。' },
      { role: 'user', content: userPrompt },
      { role: 'assistant', content: existingContent },
      { role: 'user', content: '请接着上面的内容继续写完，不要重复，直接继续。' },
    ];
  } else {
    messages = [
      { role: 'system', content: systemPrompt },
      { role: 'user', content: userPrompt },
    ];
  }
  const response = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + cfg.key },
    body: JSON.stringify({
      model: cfg.model,
      messages: messages,
      temperature: 0.7,
      max_tokens: 3500,
      stream: false,
    }),
  });
  if (!response.ok) {
    const errText = await response.text();
    throw new Error('API请求失败 (' + response.status + '): ' + errText.substring(0, 200));
  }
  const data = await response.json();
  let content = '';
  if (data.choices && data.choices[0]) {
    content = data.choices[0].message?.content || data.choices[0].text || data.choices[0].delta?.content || '';
  }
  if (!content && data.output) content = data.output;
  const finishReason = data.choices?.[0]?.finish_reason || '';
  const truncated = finishReason === 'length' || (content.length >= 3400);
  return { content: content, truncated: truncated, finishReason: finishReason };
}

async function startInterpretation() {
  if (isReading) return;
  if (drawnCards.length === 0) { setAiStatus('请先抽牌', 'error'); return; }
  const cfg = {
    base: document.getElementById('apiBase').value.trim(),
    key: document.getElementById('apiKey').value.trim(),
    model: document.getElementById('apiModel').value.trim(),
  };
  localStorage.setItem('tarot_api_config', JSON.stringify(cfg));
  if (!cfg.base || !cfg.key || !cfg.model) {
    setAiStatus('请先在上方填写 API 地址、Key 和模型（点获取按钮拉模型列表）', 'error');
    return;
  }
  isReading = true;
  document.getElementById('interpretBtn').disabled = true;
  document.getElementById('continueBtn').style.display = 'none';
  document.getElementById('feedbackPanel').style.display = 'none';
  document.getElementById('supplementCardsArea').style.display = 'none';
  currentReadingText = '';
  setAiStatus('⏳ AI正在生成解读，请稍候...');
  showReadingLoading('AI正在生成解读...\n正在结合你的问题和抽到的牌面进行分析...');
  setOperationStatus('✨ 正在生成AI解读，请稍候...');

  const systemPrompt = buildSystemPrompt();
  const userPrompt = buildUserPrompt();
  try {
    const result = await callAI(cfg, systemPrompt, userPrompt, null);
    currentReadingText = result.content;
    if (currentReadingText && currentReadingText.trim()) {
      renderReading(currentReadingText);
      if (result.truncated) {
        setAiStatus('⚠️ 内容较长被截断，点击"继续生成"让AI接着写完', 'error');
        document.getElementById('continueBtn').style.display = 'inline-block';
      } else {
        setAiStatus('✅ 解读完成！如果有不准的地方可以在下方反馈修正', 'success');
      }
      document.getElementById('feedbackPanel').style.display = 'block';
      setOperationDone('✅ AI解读完成！如有不准可在下方反馈修正');
    } else {
      setAiStatus('API返回内容为空。请检查：1)模型名是否正确 2)Key是否有余额 3)换个模型试试。', 'error');
      document.getElementById('readingBox').innerHTML = '<span style="color:#8a7a5c;">API返回为空，请检查模型名和Key是否正确，或换一个模型试试。</span>';
      setOperationStatus('', false);
    }
  } catch (err) {
    console.error(err);
    setAiStatus('❌ ' + err.message, 'error');
    document.getElementById('readingBox').innerHTML = '<span style="color:#ef9a9a;">解读出错：' + err.message + '</span>';
    setOperationStatus('', false);
  } finally {
    isReading = false;
    document.getElementById('interpretBtn').disabled = false;
  }
}

async function continueReading() {
  if (isReading || !currentReadingText) return;
  const cfg = {
    base: document.getElementById('apiBase').value.trim(),
    key: document.getElementById('apiKey').value.trim(),
    model: document.getElementById('apiModel').value.trim(),
  };
  isReading = true;
  document.getElementById('continueBtn').disabled = true;
  document.getElementById('continueBtn').textContent = '生成中...';
  setAiStatus('AI正在继续写，请稍候...');
  setOperationStatus('📝 正在继续生成解读...');
  const systemPrompt = buildSystemPrompt();
  const userPrompt = buildUserPrompt();
  try {
    const result = await callAI(cfg, systemPrompt, userPrompt, currentReadingText);
    const newContent = result.content;
    if (newContent && newContent.trim()) {
      currentReadingText = currentReadingText + '\n' + newContent;
      renderReading(currentReadingText);
      if (result.truncated) {
        setAiStatus('⚠️ 还有内容被截断，可再次点击"继续生成"', 'error');
      } else {
        setAiStatus('✅ 解读完成！', 'success');
        document.getElementById('continueBtn').style.display = 'none';
      }
      setOperationDone('✅ 继续生成完成！');

      setAiStatus('继续生成返回为空，可能已经写完了', 'success');
      document.getElementById('continueBtn').style.display = 'none';
      setOperationStatus('', false);
    }
  } catch (err) {
    setAiStatus('❌ 继续生成出错：' + err.message, 'error');
    setOperationStatus('', false);
  } finally {
    isReading = false;
    document.getElementById('continueBtn').disabled = false;
    document.getElementById('continueBtn').textContent = '📝 继续生成';
  }
}

    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/\n/g, '<br>');
  box.innerHTML = html;
}

  document.getElementById('supplementCardsArea').style.display = 'block';
  suppCards.forEach(function(card, i) {
    const slot = document.createElement('div');
    slot.className = 'card-slot';
    slot.style.transform = 'scale(0.85)';
    slot.style.margin = '-15px 0';
    slot.innerHTML =
      '<div class="card-position-label">补充牌' + (i+1) + '</div>' +
      '<div class="card flipped' + (card.reversed ? ' reversed' : '') + '">' +
        '<div class="card-face card-back"><div class="card-back-pattern"></div></div>' +
        '<div class="card-face card-front"><img src="cards/' + card.file + '" alt="' + card.name + '" loading="lazy"></div>' +
      '</div>' +
      '<div class="card-info">' +
        '<div class="card-name">' + card.name + '</div>' +
        '<div class="card-name-en">' + card.en + '</div>' +
        '<div class="card-orientation ' + (card.reversed ? 'reversed' : 'upright') + '">' + (card.reversed ? '逆 位' : '正 位') + '</div>' +
      '</div>';
    area.appendChild(slot);
  });
}

function drawSupplementCards(count) {
  const usedIds = drawnCards.map(function(c) { return c.id; });
  const remaining = cards.filter(function(c) { return usedIds.indexOf(c.id) < 0; });
  return shuffle(remaining).slice(0, count).map(function(c) { return Object.assign({}, c, {reversed: Math.random() < 0.5}); });
}

function buildFeedbackPrompt(feedback, suppCards) {
  const modeName = currentMode === 'reality' ? '现实占卜' : '梦向占卜（梦占）';
  const spreadName = document.getElementById('spreadSelect').selectedOptions[0].text;
  const question = document.getElementById('question').value.trim();
  const labels = getLabels(drawnCards.length);
  let cardText = '';
  drawnCards.forEach(function(c, i) {
    cardText += (i+1) + '. 【' + (labels[i] || '第'+(i+1)+'张') + '】' + c.name + '（' + c.en + '）—— ' + (c.reversed ? '逆位' : '正位') + '\n';
  });
  let suppText = '';
  if (suppCards && suppCards.length > 0) {
    suppText = '\n\n【补充抽到的牌】（无牌阵，用于补充说明和修正）\n';
    suppCards.forEach(function(c, i) {
      suppText += (i+1) + '. ' + c.name + '（' + c.en + '）—— ' + (c.reversed ? '逆位' : '正位') + '\n';
    });
  }
  return '【占卜模式】' + modeName + '\n【牌阵】' + spreadName + '\n【问卜者问题】' + question +
    '\n\n【最初抽到的牌】\n' + cardText +
    '\n【之前的解读】\n' + currentReadingText +
    '\n\n【用户反馈】用户认为以下地方解读不准：\n"' + feedback + '"' +
    suppText +
    '\n\n请根据用户的反馈，结合牌面信息' + (suppCards ? '和补充牌' : '') + '，对之前的解读进行修正和补充。' +
    '指出之前哪里解读有偏差，给出修正后的解读。如果用户反馈的情况属实，请调整解读方向；如果牌面显示并非如此，也可以温和地说明牌面的真实指向。' +
    '请直接给出修正后的完整解读，不要只说"我修正了"。';
}

function setFeedbackButtonsDisabled(disabled) {
  const btns = document.querySelectorAll('#feedbackPanel button');
  btns.forEach(function(b) { b.disabled = disabled; });
}

async function doFeedbackReading(feedback, suppCards) {
  if (isReading) return;
  if (!feedback.trim()) { setAiStatus('请先描述你觉得哪里解读不准', 'error'); return; }
  const cfg = {
    base: document.getElementById('apiBase').value.trim(),
    key: document.getElementById('apiKey').value.trim(),
    model: document.getElementById('apiModel').value.trim(),
  };
  if (!cfg.base || !cfg.key || !cfg.model) {
    setAiStatus('请先配置 API 地址、Key 和模型', 'error');
    return;
  }
  const actionText = suppCards ? '补充抽牌修正解读' : '直接修正解读';
  const actionIcon = suppCards ? '🃏' : '✏️';
  isReading = true;
  document.getElementById('interpretBtn').disabled = true;
  setFeedbackButtonsDisabled(true);
  setAiStatus('⏳ 正在进行【' + actionText + '】，AI正在生成中...');
  showReadingLoading('正在进行【' + actionText + '】\nAI正在结合你的反馈和牌面信息进行修正解读...');
  setOperationStatus(actionIcon + ' 正在进行【' + actionText + '】，AI正在生成中...');

  const systemPrompt = buildSystemPrompt();
  const userPrompt = buildFeedbackPrompt(feedback, suppCards);
  try {
    const result = await callAI(cfg, systemPrompt, userPrompt, null);
    const newContent = result.content;
    if (newContent && newContent.trim()) {
      currentReadingText = currentReadingText + '\n\n---\n\n## ✏️ 修正解读（' + actionText + '）\n\n' + newContent;
      renderReading(currentReadingText);
      if (result.truncated) {
        setAiStatus('⚠️ 修正解读被截断，可点击"继续生成"让AI接着写完', 'error');
        document.getElementById('continueBtn').style.display = 'inline-block';
      } else {
        setAiStatus('✅ 【' + actionText + '】完成！你可以继续反馈或重新抽牌', 'success');
      }
      setOperationDone('✅ 【' + actionText + '】完成！');
      setTimeout(function() {
        const box = document.getElementById('readingBox');
        box.scrollTop = box.scrollHeight;
      }, 100);
    } else {
      setAiStatus('修正解读返回为空，请重试', 'error');
      document.getElementById('readingBox').innerHTML = '<span style="color:#ef9a9a;">AI返回内容为空，请检查API设置后重试。</span>';
      setOperationStatus('', false);
    }
  } catch (err) {
    setAiStatus('❌ 修正解读出错：' + err.message, 'error');
    document.getElementById('readingBox').innerHTML = '<span style="color:#ef9a9a;">解读出错：' + err.message + '</span>';
    setOperationStatus('', false);
  } finally {
    isReading = false;
    document.getElementById('interpretBtn').disabled = false;
    setFeedbackButtonsDisabled(false);
  }
}

function supplementReading() {
  if (isReading) { setAiStatus('正在解读中，请稍候...', 'error'); return; }
  const feedback = document.getElementById('feedbackInput').value.trim();
  if (!feedback) { setAiStatus('请先描述你觉得哪里解读不准', 'error'); return; }
  setAiStatus('⏳ 正在从剩余牌中抽取3张补充牌...');
  setFeedbackButtonsDisabled(true);
  setOperationStatus('🃏 正在从剩余牌中抽取3张补充牌...');
  setTimeout(function() {
    const suppCards = drawSupplementCards(3);
    showSupplementCards(suppCards);
    const suppNames = suppCards.map(function(c) { return c.name + (c.reversed ? '(逆)' : '(正)'); }).join('、');
    setAiStatus('✅ 已抽到补充牌：' + suppNames + '。AI正在结合补充牌进行修正解读...');
    setOperationStatus('🃏 已抽到补充牌，AI正在进行补充抽牌修正解读...');
    doFeedbackReading(feedback, suppCards);
  }, 500);
}

function redrawReading() {
  if (isReading) { setAiStatus('正在解读中，请稍候...', 'error'); return; }
  const feedback = document.getElementById('feedbackInput').value.trim();
  if (!feedback) { setAiStatus('请先描述你觉得哪里解读不准', 'error'); return; }
  setAiStatus('⏳ 正在重新抽取牌阵...');
  setFeedbackButtonsDisabled(true);
  document.getElementById('continueBtn').style.display = 'none';
  document.getElementById('supplementCardsArea').style.display = 'none';
  setOperationStatus('🔄 正在重新抽取牌阵，稍后AI将结合你的反馈重新解读...');
  setTimeout(function() {
    const count = getDrawCount();
    const labels = getLabels(count);
    drawnCards = shuffle(cards).slice(0, count).map(function(c) { return Object.assign({}, c, {reversed: Math.random() < 0.5}); });
    const area = document.getElementById('spreadArea');
    area.innerHTML = '';
    drawnCards.forEach(function(card, i) {
      const slot = document.createElement('div');
      slot.className = 'card-slot';
      slot.innerHTML =
        '<div class="card-position-label">' + (labels[i] || '第'+(i+1)+'张') + '</div>' +
        '<div class="card flipped' + (card.reversed ? ' reversed' : '') + '">' +
          '<div class="card-face card-back"><div class="card-back-pattern"></div></div>' +
          '<div class="card-face card-front"><img src="cards/' + card.file + '" alt="' + card.name + '" loading="lazy"></div>' +
        '</div>' +
        '<div class="card-info">' +
          '<div class="card-name">' + card.name + '</div>' +
          '<div class="card-name-en">' + card.en + '</div>' +
          '<div class="card-orientation ' + (card.reversed ? 'reversed' : 'upright') + '">' + (card.reversed ? '逆 位' : '正 位') + '</div>' +
        '</div>';
      area.appendChild(slot);
    });
    currentReadingText = '';
    showReadingLoading('已重新抽取牌阵，AI正在结合你的反馈重新解读...');
    setAiStatus('✅ 已重新抽牌，AI正在结合你的反馈重新解读...');
    setOperationStatus('🔄 已重新抽牌，AI正在结合你的反馈重新解读...');

    const cfg = {
      base: document.getElementById('apiBase').value.trim(),
      key: document.getElementById('apiKey').value.trim(),
      model: document.getElementById('apiModel').value.trim(),
    };
    isReading = true;
    document.getElementById('interpretBtn').disabled = true;
    const systemPrompt = buildSystemPrompt();
    const modeName = currentMode === 'reality' ? '现实占卜' : '梦向占卜（梦占）';
    const spreadName = document.getElementById('spreadSelect').selectedOptions[0].text;
    const question = document.getElementById('question').value.trim();
    let cardText = '';
    drawnCards.forEach(function(c, i) {
      cardText += (i+1) + '. 【' + (labels[i] || '第'+(i+1)+'张') + '】' + c.name + '（' + c.en + '）—— ' + (c.reversed ? '逆位' : '正位') + '\n';
    });
    const userPrompt = '【占卜模式】' + modeName + '\n【牌阵】' + spreadName + '\n【问卜者问题】' + question +
      '\n\n【用户反馈】之前的解读有以下不准确的地方：\n"' + feedback + '"' +
      '\n\n【重新抽到的牌】\n' + cardText +
      '\n请根据用户的反馈，结合这组新抽到的牌，重新进行解读。注意用户反馈的情况，解读方向要结合反馈进行调整。给出完整的解读。';

    (async function() {
      try {
        const result = await callAI(cfg, systemPrompt, userPrompt, null);
        currentReadingText = result.content;
        if (currentReadingText && currentReadingText.trim()) {
          renderReading(currentReadingText);
          if (result.truncated) {
            setAiStatus('⚠️ 重新解读被截断，可点击"继续生成"', 'error');
            document.getElementById('continueBtn').style.display = 'inline-block';
          } else {
            setAiStatus('✅ 【重新抽牌解读】完成！', 'success');
          }
          setOperationDone('✅ 【重新抽牌解读】完成！');
        } else {
          setAiStatus('重新解读返回为空，请重试', 'error');
          document.getElementById('readingBox').innerHTML = '<span style="color:#ef9a9a;">AI返回内容为空，请重试。</span>';
          setOperationStatus('', false);
        }
      } catch (err) {
        setAiStatus('❌ 重新解读出错：' + err.message, 'error');
        document.getElementById('readingBox').innerHTML = '<span style="color:#ef9a9a;">解读出错：' + err.message + '</span>';
        setOperationStatus('', false);
      } finally {
        isReading = false;
        document.getElementById('interpretBtn').disabled = false;
        setFeedbackButtonsDisabled(false);
      }
    })();
  }, 500);
}

function reviseReading() {
  if (isReading) { setAiStatus('正在解读中，请稍候...', 'error'); return; }
  const feedback = document.getElementById('feedbackInput').value.trim();
  if (!feedback) { setAiStatus('请先描述你觉得哪里解读不准', 'error'); return; }
  document.getElementById('supplementCardsArea').style.display = 'none';
  setAiStatus('⏳ 正在进行【直接修正解读】，不抽取新牌，AI根据你的反馈修正...');
  setOperationStatus('✏️ 正在进行【直接修正解读】，AI根据你的反馈修正原解读...');
  doFeedbackReading(feedback, null);
}
